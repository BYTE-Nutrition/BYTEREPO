name: Deploy to Vercel on Merge to Main
on:
  pull_request:
    types:
      - closed
    branches:
      - main
jobs:
  deploy:
    if: |
      github.event.pull_request.merged == true &&
      (github.event.pull_request.merged_by.login == 'ssubedi2' ||
       github.event.pull_request.merged_by.login == 'FifiTeklemedhin')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel deployment via Deploy Hook..."
          curl -X POST "$VERCEL_DEPLOY_HOOK"
      - name: Log successful trigger
        run: echo "Deploy hook triggered successfully!"
