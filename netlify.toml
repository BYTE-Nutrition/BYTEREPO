# Main UI: Vite + React Router in app/. Netlify installs and builds from that folder.
[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

# Deep links (e.g. /home, /meals/...) must serve SPA shell; real files still win (shadowing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
